[workspace]
members = ["crates/lspf-analysis-core", "crates/lspf-analysis"]
exclude = ["enums"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/meymchen/lspf-analysis"
license = "MPL-2.0"

[workspace.dependencies]
lspf-analysis-core = { path = "crates/lspf-analysis-core", version = "0.1.0" }
lspf = { version = "1", default-features = false, features = ["stdio", "tcp", "websocket"] }
clap = { version = "^4.0", features = ["derive"] }
globset = "^0.4"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
insta = { version = "1.29.0", features = ["yaml", "json", "redactions"] }

[workspace.lints.rust]
# The tree-sitter grammar crates' generated parser.c marks each
# `tree_sitter_<language>` entry point `__declspec(dllexport)`, so every binary
# linked here exports seven symbols. MSVC's link.exe then announces the import
# library it creates for them on stdout, and `linker_messages` reports anything
# the linker writes as a warning. It lands on the binary and on every test
# executable, and nothing short of patching the grammar crates stops the export.
linker_messages = "allow"

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "unwind"
incremental = false
overflow-checks = false
strip = "debuginfo"
