settings.complexityThreshold=Cognitive complexity:
settings.complexityThreshold.comment=Cognitive complexity scoring 50%. Scores the control-flow pillar alongside cyclomatic complexity; the pillar takes whichever of the two scores worse.
settings.cyclomaticThreshold=Cyclomatic complexity:
settings.cyclomaticThreshold.comment=Cyclomatic complexity scoring 50%. Scores the control-flow pillar alongside cognitive complexity; the pillar takes whichever of the two scores worse. McCabe''s recommended upper bound is 10.
settings.lengthThreshold=Statements:
settings.lengthThreshold.comment=Statements (logical lines) scoring 50%. The only measure of the size pillar.
settings.workingMemoryThreshold=Working memory:
settings.workingMemoryThreshold.comment=Names held at once scoring 50%. Scores the vocabulary-load pillar alongside Halstead difficulty; the pillar takes whichever of the two scores worse.
settings.halsteadDifficultyThreshold=Halstead difficulty:
settings.halsteadDifficultyThreshold.comment=Halstead difficulty scoring 50%. Scores the vocabulary-load pillar alongside working memory; the pillar takes whichever of the two scores worse.
settings.parametersThreshold=Parameters:
settings.parametersThreshold.comment=Parameter count scoring 50%. The only measure of the interface pillar.
settings.wmcThreshold=Weighted methods per class:
settings.wmcThreshold.comment=Weighted methods per class scoring 50%. A measure of the class-design pillar.
settings.publicMethodsThreshold=Public methods per class:
settings.publicMethodsThreshold.comment=Public methods per class scoring 50%. A measure of the class-design pillar.
settings.publicAttributesThreshold=Public attributes per class:
settings.publicAttributesThreshold.comment=Public attributes per class scoring 50%. A measure of the class-design pillar.
settings.weights.complexity=Control flow:
settings.weights.length=Size:
settings.weights.workingMemory=Vocabulary load:
settings.weights.interface=Interface:
settings.weights.classDesign=Class design:
settings.weights.comment=Weights are normalized by their sum, so only their ratio matters. Interface is half the others by default: a wide signature is a real signal, but a narrower one than the three pillars describing what a function does. Class design weighs a file''s classes against its functions, and only applies to languages whose class-level metrics are computed, which today means Java.
settings.qualityWarn=Warn below:
settings.qualityWarn.comment=Quality below this is reported as a warning.
settings.qualityError=Error below:
settings.qualityError.comment=Quality below this is reported as an error rather than a warning.
settings.diagnostics.enabled=Publish diagnostics
settings.diagnostics.enabled.comment=Turning this off clears what is displayed.
settings.diagnostics.perMetric=Also hint at one badly scoring pillar
settings.diagnostics.perMetric.comment=Report a function whose quality passes but which has one badly scoring pillar.
settings.diagnostics.file=Also report the file as a whole
settings.diagnostics.file.comment=Report the file when its quality is bad enough to be an error.
settings.statusBar.enabled=Show the file''s quality in the status bar
settings.gutterIcons.enabled=Show health icons in the editor gutter
settings.serverPath=Language server path:
settings.serverPath.comment=Path to an lspf-analysis binary to use instead of the one packaged with this plugin. A leading ~ is expanded. Changing this restarts the server.
settings.serverLog.comment=The conversation with the server is logged by the IDE. Turn on 'Show in tool window' for the 'LSP log: info, trace' category in Settings | Appearance & Behavior | Notifications.

settings.error.number=Enter a number.
settings.error.positive=Must be greater than 0.
settings.error.nonNegative=Must be 0 or greater.
settings.error.percentage=Must be between 0 and 100.

