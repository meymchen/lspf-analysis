# Display text, in the language it was written in. Keys are shared with the
# pure model layer, which reads this same file through ResourceBundle when no
# IDE translator is installed -- that is what lets its tests assert on real
# strings without starting a platform fixture.

plugin.name=LSPF Analysis

# The vocabulary the server sends. It stays English on the wire whatever the
# reader sees, because a client keys off it; it is translated at the moment it
# is drawn. The server translates the same vocabulary the same way for the text
# it renders itself.
