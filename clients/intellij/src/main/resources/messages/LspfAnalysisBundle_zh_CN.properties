settings.title=LSPF Analysis
settings.group.thresholds=阈值
settings.group.weights=权重
settings.group.classes=类
settings.group.diagnostics=诊断
settings.group.interface=接口
settings.group.server=服务器
settings.complexityThreshold=认知复杂度：
settings.complexityThreshold.comment=认知复杂度达到该值时得 50 分。它和圈复杂度共同决定控制流支柱，支柱取两者中更差的那个。
settings.cyclomaticThreshold=圈复杂度：
settings.cyclomaticThreshold.comment=圈复杂度达到该值时得 50 分。它和认知复杂度共同决定控制流支柱，支柱取两者中更差的那个。McCabe 建议的上限是 10。
settings.lengthThreshold=语句数：
settings.lengthThreshold.comment=语句数（逻辑行）达到该值时得 50 分。规模支柱唯一的度量。
settings.workingMemoryThreshold=工作记忆：
settings.workingMemoryThreshold.comment=同时持有的名称数达到该值时得 50 分。它和 Halstead 难度共同决定词汇负担支柱，支柱取两者中更差的那个。
settings.halsteadDifficultyThreshold=Halstead 难度：
settings.halsteadDifficultyThreshold.comment=Halstead 难度达到该值时得 50 分。它和工作记忆共同决定词汇负担支柱，支柱取两者中更差的那个。
settings.parametersThreshold=参数个数：
settings.parametersThreshold.comment=参数个数达到该值时得 50 分。接口支柱唯一的度量。
settings.wmcThreshold=类的加权方法数：
settings.wmcThreshold.comment=类的加权方法数达到该值时得 50 分。类设计支柱的度量之一。
settings.publicMethodsThreshold=类的公有方法数：
settings.publicMethodsThreshold.comment=类的公有方法数达到该值时得 50 分。类设计支柱的度量之一。
settings.publicAttributesThreshold=类的公有属性数：
settings.publicAttributesThreshold.comment=类的公有属性数达到该值时得 50 分。类设计支柱的度量之一。
settings.weights.complexity=控制流：
settings.weights.length=规模：
settings.weights.workingMemory=词汇负担：
settings.weights.interface=接口：
settings.weights.classDesign=类设计：
settings.weights.comment=权重会按总和归一化，所以只有比例有意义。接口默认是其他支柱的一半：签名过宽确实是个信号，但比描述函数在做什么的那三个支柱要窄。类设计权衡文件中的类相对于函数的分量，只对真正计算了类级指标的语言生效，目前只有 Java。
settings.qualityWarn=低于此值报警告：
settings.qualityWarn.comment=质量低于此值的函数会被报为警告。
settings.qualityError=低于此值报错误：
settings.qualityError.comment=质量低于此值的函数会被报为错误而不是警告。
settings.diagnostics.enabled=发布诊断
settings.diagnostics.enabled.comment=关掉会清除已显示的内容。
settings.diagnostics.perMetric=对某个支柱得分很差的函数额外提示
settings.diagnostics.perMetric.comment=对整体质量达标、但某个支柱得分很差的函数给出一条提示。
settings.diagnostics.file=额外报告整个文件
settings.diagnostics.file.comment=当整个文件的质量差到构成错误时，额外报告文件本身。
settings.statusBar.enabled=在状态栏显示当前文件的整体质量
settings.gutterIcons.enabled=在编辑器行号旁显示健康度图标
settings.serverPath=语言服务器路径：
settings.serverPath.comment=改用这个 lspf-analysis 可执行文件，而不是插件自带的那个。开头的 ~ 会被展开。修改后会重启服务器。
settings.serverLog.comment=与服务器之间往来的消息由 IDE 记录。在“设置 | 外观与行为 | 通知”里为“LSP log: info, trace”类别打开“在工具窗口中显示”即可查看。

settings.error.number=请输入一个数字。
settings.error.positive=必须大于 0。
settings.error.nonNegative=必须大于或等于 0。
settings.error.percentage=必须在 0 到 100 之间。

