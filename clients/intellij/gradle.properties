group = com.github.meymchen
version = 0.1.0

# The server binary is built for one platform per ZIP, the way the VS Code
# client builds one VSIX per platform. Override with -Ptarget=<name>; the
# supported names are listed in build.gradle.kts.
target = win32-x64

# The platform bundles its own Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
