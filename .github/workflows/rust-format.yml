name: Rust formatting

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check workspace formatting with the pinned toolchain
        run: cargo fmt --all -- --check
      - name: Check grammar generator formatting
        run: cargo fmt --manifest-path enums/Cargo.toml -- --check
