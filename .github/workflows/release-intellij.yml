name: Release IntelliJ plugin

on:
  push:
    tags: ["intellij-v*"]
  pull_request:
    paths:
      - .github/workflows/release-intellij.yml
      - clients/intellij/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  # Dispatch is a build-only rehearsal, even when a tag is selected.
  workflow_dispatch:

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      publish: ${{ steps.metadata.outputs.publish }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      platforms: ${{ steps.metadata.outputs.platforms }}
      ides: ${{ steps.metadata.outputs.ides }}
      reuse: ${{ steps.saved.outputs.reuse || 'none' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Metadata compares the PR's changes to select the IDE matrix.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s clients/intellij/scripts -p 'test_*.py'
      - id: metadata
        # Ordinary PRs use three IDE builds; compatibility changes, tags, and
        # manual rehearsals use the complete release.json matrix.
        run: python clients/intellij/scripts/release.py metadata
      - id: saved
        if: steps.metadata.outputs.publish == 'true'
        run: python clients/intellij/scripts/publish.py probe
        env:
          GH_TOKEN: ${{ github.token }}

  checks:
    needs: prepare
    # PRs run these checks in ci.yml; tags and manual rehearsals are self-contained.
    if: github.event_name != 'pull_request' && needs.prepare.outputs.reuse == 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: ./gradlew --continue ktlintCheck test --no-configuration-cache
        working-directory: clients/intellij
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intellij-check-reports
          path: clients/intellij/build/reports

  server:
    needs: prepare
    if: needs.prepare.outputs.reuse == 'none'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      RUST_TARGET: ${{ matrix.rust }}
      PACKAGE_TARGET: ${{ matrix.target }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - run: |
          rustup toolchain install
          rustup target add "${RUST_TARGET}"
          cargo build --locked --release --package lspf-analysis --target "${RUST_TARGET}"
      - run: python clients/intellij/scripts/release.py stage --target "${PACKAGE_TARGET}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intellij-server-${{ matrix.variant }}
          path: clients/intellij/build/native
          if-no-files-found: error

  package:
    needs: [prepare, server]
    if: needs.prepare.outputs.reuse == 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: intellij-server-*
          path: clients/intellij/build/native
          merge-multiple: true
      - run: chmod +x build/native/*/server/*
        working-directory: clients/intellij
      - run: ./gradlew buildPluginVariants --no-configuration-cache
        working-directory: clients/intellij
      - run: python clients/intellij/scripts/release.py inspect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intellij-unsigned
          path: clients/intellij/build/distributions/*.zip
          if-no-files-found: error

  native-smoke:
    needs: [prepare, package]
    if: needs.prepare.outputs.reuse == 'none'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intellij-unsigned
          path: clients/intellij/build/distributions
      - shell: bash
        run: python clients/intellij/scripts/release.py smoke --target "${PACKAGE_TARGET}"

  compatibility:
    needs: [prepare, package]
    if: needs.prepare.outputs.reuse == 'none'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.ides) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERIFY_IDE: ${{ matrix.type }}:${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intellij-unsigned
          path: clients/intellij/build/distributions
      - working-directory: clients/intellij
        run: |
          archives=(build/distributions/*-linux-x86_64.zip)
          ./gradlew verifyPlugin -PreleaseArchive="${archives[0]}" -PverificationIde="${VERIFY_IDE}" --no-configuration-cache
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intellij-verifier-${{ matrix.type }}-${{ matrix.version }}
          path: clients/intellij/build/reports/pluginVerifier

  installation:
    needs: [prepare, package]
    if: needs.prepare.outputs.reuse == 'none'
    strategy:
      fail-fast: false
      matrix:
        ide: [IntellijIdea, PyCharm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SMOKE_IDE: ${{ matrix.ide }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intellij-unsigned
          path: clients/intellij/build/distributions
      - run: python clients/intellij/scripts/release.py install-smoke --target linux-x64
      - working-directory: clients/intellij
        run: ./gradlew releaseSmoke -PsmokeIde="${SMOKE_IDE}" --no-configuration-cache
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intellij-installation-${{ matrix.ide }}
          path: clients/intellij/build/reports/tests

  sign:
    needs: [prepare, checks, native-smoke, compatibility, installation]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.reuse == 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: intellij-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intellij-unsigned
          path: clients/intellij/build/distributions
      - name: Sign each tested archive and verify its signature
        run: python clients/intellij/scripts/sign.py
        env:
          INTELLIJ_PRIVATE_KEY: ${{ secrets.INTELLIJ_PRIVATE_KEY }}
          INTELLIJ_CERTIFICATE_CHAIN: ${{ secrets.INTELLIJ_CERTIFICATE_CHAIN }}
          INTELLIJ_PRIVATE_KEY_PASSWORD: ${{ secrets.INTELLIJ_PRIVATE_KEY_PASSWORD }}
      # This immutable artifact is the recovery source even if GitHub upload fails.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intellij-signed
          path: clients/intellij/build/signed
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, sign]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.publish == 'true' &&
      (needs.sign.result == 'success' || needs.prepare.outputs.reuse != 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: intellij-release
    # Serialize all version uploads, while allowing builds to run concurrently.
    concurrency:
      group: intellij-marketplace-publisher
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.prepare.outputs.reuse != 'github'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intellij-signed
          path: clients/intellij/build/signed
      - if: needs.prepare.outputs.reuse == 'github'
        run: python clients/intellij/scripts/publish.py download
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python clients/intellij/scripts/publish.py github
        env:
          GH_TOKEN: ${{ github.token }}
      - if: needs.prepare.outputs.prerelease == 'false'
        run: python clients/intellij/scripts/publish.py marketplace
        env:
          GH_TOKEN: ${{ github.token }}
          INTELLIJ_PUBLISH_TOKEN: ${{ secrets.INTELLIJ_PUBLISH_TOKEN }}
          INTELLIJ_MARKETPLACE_READY: ${{ vars.INTELLIJ_MARKETPLACE_READY }}

  release-checks:
    if: always()
    needs:
      [
        prepare,
        checks,
        server,
        package,
        native-smoke,
        compatibility,
        installation,
        sign,
        publish,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
