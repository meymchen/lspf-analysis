name: Release standalone server

on:
  push:
    tags: ["server-v*"]
  pull_request:
    paths:
      - .github/workflows/release-server.yml
      - scripts/**
      - clients/zed/scripts/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  # Build all targets without publishing, even if a tag is selected.
  workflow_dispatch:

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      publish: ${{ steps.metadata.outputs.publish }}
      platforms: ${{ steps.metadata.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - id: metadata
        run: python scripts/release_server.py metadata

  checks:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      RUST_TARGET: ${{ matrix.target }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - run: |
          rustup toolchain install
          rustup target add "${RUST_TARGET}"
          cargo build --locked --release --package lspf-analysis --target "${RUST_TARGET}"
      - name: Stage and exercise the distributable executable
        run: |
          python scripts/release_server.py stage --target "${RUST_TARGET}"
          binaries=(target/server-dist/lspf-analysis-*)
          python clients/zed/scripts/lsp_smoke.py "${binaries[0]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ matrix.target }}
          path: target/server-dist/
          if-no-files-found: error

  publish:
    needs: [prepare, checks, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SERVER_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-*
          path: target/server-dist
          merge-multiple: true
      - run: python scripts/release_server.py checksums
      - name: Publish only after all six assets are uploaded
        run: |
          tag="server-v${SERVER_VERSION}"
          gh release create "$tag" --draft --verify-tag --latest=false \
            --title "LSPF Analysis server ${SERVER_VERSION}" \
            --notes-file target/server-dist/SOURCE.txt
          gh release upload "$tag" target/server-dist/*
          gh release edit "$tag" --draft=false --latest=false

  server-checks:
    if: always()
    needs: [prepare, checks, build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
