[package]
name = "lspf-analysis-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["metrics", "code-quality"]
description = "Code metrics and health scoring engine behind the lspf-analysis language server"

# The health module documents its formulas in LaTeX; rustdoc has no maths of
# its own, so KaTeX is injected to render them.
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex.html"]

[lints]
workspace = true

[dependencies]
crossbeam = { version = "^0.8", features = ["crossbeam-channel"] }
globset.workspace = true
num = "^0.4"
num-derive = "^0.4"
num-traits = "^0.2"
petgraph = "^0.8"
regex = "^1.7"
serde.workspace = true
termcolor = "^1.2"
walkdir = "^2.3"

tree-sitter = "=0.26.13"
tree-sitter-cpp = "=0.23.4"
tree-sitter-java = "=0.23.5"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"

[dev-dependencies]
insta.workspace = true
pretty_assertions = "^1.3"
serde_json.workspace = true
