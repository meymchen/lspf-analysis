[package]
name = "lspf-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["lsp", "language-server", "metrics", "code-quality"]
description = "A language server that reports code health as LSP diagnostics"

[[bin]]
name = "lspf-analysis"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
lspf.workspace = true
lspf-analysis-core.workspace = true
clap.workspace = true
globset.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_cbor = "^0.11"
# default features are the upstream TUI/CLI, which we do not want linked in.
toon-format = { version = "^0.5", default-features = false }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
lspf = { version = "1.0.0", default-features = false, features = ["stdio", "testing"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
bytes = "1"
