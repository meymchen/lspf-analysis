repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-json
  - repo: local
    hooks:
      - id: fmt
        name: fmt (workspace)
        language: system
        files: '\.rs$|(^|/)Cargo\.toml$'
        exclude: "^(enums|clients/zed)/"
        entry: cargo fmt --all -- --check
        pass_filenames: false

      # enums is excluded from the root Cargo workspace.
      - id: fmt-enums
        name: fmt (enums)
        language: system
        files: '^enums/(.*\.rs|Cargo\.toml)$'
        exclude: "^enums/templates/"
        entry: cargo fmt --manifest-path enums/Cargo.toml -- --check
        pass_filenames: false

      - id: clippy
        name: clippy
        language: system
        files: '\.rs$'
        exclude: "^clients/zed/"
        entry: cargo clippy --all-targets --all -- -D warnings
        pass_filenames: false

      - id: udeps
        name: udeps
        language: system
        files: '\.rs$'
        exclude: "^clients/zed/"
        entry: cargo +nightly udeps --all-targets
        pass_filenames: false

      - id: test
        name: test
        language: system
        files: '\.rs$'
        exclude: "^clients/zed/"
        entry: cargo test --workspace
        pass_filenames: false

      - id: fmt-zed
        name: fmt (Zed)
        language: system
        files: '^clients/zed/(.*\.rs|Cargo\.toml)$|^rustfmt\.toml$'
        entry: cargo fmt --manifest-path clients/zed/Cargo.toml -- --check
        pass_filenames: false

      - id: clippy-zed
        name: clippy (Zed)
        language: system
        files: '^clients/zed/(.*\.rs|Cargo\.(toml|lock))$'
        entry: cargo clippy --manifest-path clients/zed/Cargo.toml --all-targets --locked -- -D warnings
        pass_filenames: false

      - id: test-zed
        name: test (Zed)
        language: system
        files: '^clients/zed/(.*\.rs|Cargo\.(toml|lock)|server-version)$'
        entry: cargo test --manifest-path clients/zed/Cargo.toml --locked
        pass_filenames: false

      # Run from the repository root, which covers the clients too: Prettier
      # resolves each file's .prettierrc.json by walking up from that file.
      - id: prettier
        name: prettier
        language: system
        files: '\.(html|css|json|ya?ml|[cm]?js|[cm]?ts|tsx)$'
        entry: npx prettier --check .
        pass_filenames: false

      # Markdown is markdownlint-cli2's, and only the documents people read.
      - id: markdownlint
        name: markdownlint
        language: system
        files: '\.md$'
        entry: npx markdownlint-cli2
        pass_filenames: false

      - id: ktlint
        name: ktlint
        language: system
        files: '^clients/intellij/.*\.kts?$'
        entry: bash -c 'cd clients/intellij && ./gradlew --quiet ktlintCheck'
        pass_filenames: false

      # Needs the native CLI: cargo install taplo-cli --locked. The @taplo/cli
      # npm build collects no files on Windows.
      - id: taplo
        name: taplo
        language: system
        files: '\.toml$'
        entry: taplo format --check
        pass_filenames: false

default_language_version:
  python: python3
