[package]
name = "enums"
version = "0.0.1"
authors = ["Calixte Denizet <cdenizet@mozilla.com>"]
edition = "2024"
# A code generator run from this repository, never published.
publish = false

# Its own workspace, so it cannot inherit the root's lints. Same reason: the
# grammar crates export their tree_sitter_* entry points, and MSVC's link.exe
# reports the import library it creates for them.
[lints.rust]
linker_messages = "allow"

[dependencies]
clap = { version = "^4.0", features = ["derive"] }
askama = "^0.14"

tree-sitter = "=0.27.0"
tree-sitter-cpp = "=0.23.4"
tree-sitter-java = "=0.23.5"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"

[profile.release]
strip = "debuginfo"
