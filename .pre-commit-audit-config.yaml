# Use a separate pre-commit config that runs only when Rust dependencies
# are added, removed or modified.
repos:
  - repo: local
    hooks:
      # Reads deny.toml, the same policy the audit workflow applies.
      - id: deny
        name: cargo deny (workspace)
        language: system
        files: '(^|/)Cargo\.(lock|toml)$|^deny\.toml$'
        exclude: "^(enums|clients/zed)/"
        entry: cargo deny check
        pass_filenames: false

      # enums is excluded from the root Cargo workspace.
      - id: deny-enums
        name: cargo deny (enums)
        language: system
        files: '^enums/Cargo\.(lock|toml)$|^deny\.toml$'
        entry: cargo deny --manifest-path enums/Cargo.toml check
        pass_filenames: false

      - id: deny-zed
        name: cargo deny (Zed)
        language: system
        files: '^clients/zed/Cargo\.(lock|toml)$|^deny\.toml$'
        entry: cargo deny --manifest-path clients/zed/Cargo.toml check
        pass_filenames: false

default_language_version:
  python: python3
